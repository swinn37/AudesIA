# Juge de qualité (eval/judge.py) : un VLM absent des deux chaînes comparées.
# Sur le GX10 : Qwen3.5-122B-A10B en NVFP4, servi seul une fois les runs finis (scripts/docker.sh start juge).
# Pour comparer deux runs du profil small (tout en Gemma), Qwen3.6 sous Ollama convient aussi.

[judge]
base_url = "http://127.0.0.1:8000/v1"
model = "nvidia/Qwen3.5-122B-A10B-NVFP4"
extra_body = { chat_template_kwargs = { enable_thinking = false } }
parallel = 4   # fenêtres jugées en même temps, en lot par vLLM (--max-num-seqs 4 dans scripts/docker.sh)
